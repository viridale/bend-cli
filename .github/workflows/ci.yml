name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source_checks:
    name: Bend source checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/bend-install.sh
          sh /tmp/bend-install.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Check Bend version
        id: bend
        run: |
          bend version
          version="$(bend version | awk '{print $2}')"
          IFS=. read -r major minor patch <<< "$version"
          if (( major < 2 || (major == 2 && minor == 0 && patch < 36) )); then
            echo "Bend 2.0.36 or newer is required" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check source modules
        run: |
          find . -name '*.bend' -not -path './tmp/*' \
            -not -path './LAWS.bend' -not -path './PROOF.bend' -print | sort |
            while IFS= read -r file; do
              bend "$file" --check-only
            done
      # --verdict builds Bend's proof kernel with Lean once per Bend version
      # and reuses it from ~/.bend/bendtt; the cache saves only on success.
      - name: Restore proof kernel
        id: kernel
        uses: actions/cache@v6
        with:
          path: ~/.bend/bendtt
          key: bendtt-${{ runner.os }}-${{ steps.bend.outputs.version }}
      - name: Install Lean
        if: steps.kernel.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.0
      - name: Check proofs
        run: |
          bend PROOF.bend --verdict
          find examples -name PROOF.bend -print | sort |
            while IFS= read -r file; do
              bend "$file" --verdict
            done

  # Add G4-G8 in milestone order as their implementations become runnable.
