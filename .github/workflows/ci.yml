name: ci

# A push or pull request that changes only docs runs nothing; start a run
# by hand from the Actions tab when one should. A newer push to the same
# ref cancels the run in progress.
on:
  push:
    paths-ignore: ['**.md', LICENSE]
  pull_request:
    paths-ignore: ['**.md', LICENSE]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source_checks:
    name: Bend source checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/bend-install.sh
          sh /tmp/bend-install.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Check Bend version
        id: bend
        run: |
          bend version
          version="$(bend version | awk '{print $2}')"
          IFS=. read -r major minor patch <<< "$version"
          if (( major < 2 || (major == 2 && minor == 0 && patch < 38) )); then
            echo "Bend 2.0.38 or newer is required" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Each file must print exactly its expected output and exit with its
      # expected status. run.bend's host effects are foreign, so run.bend
      # and each file importing it print SOME PROOFS FAIL, exit 1 and list
      # the defs that rely on them (SPEC F1, G2): run.bend's defs behind the
      # importer's path to it, then the importer's own. Every other file
      # prints ALL PROOFS CHECK and the --verdict hint, and exits 0. A
      # LAWS.bend has a TODO per law, and its PROOF.bend runs under Check
      # proofs.
      - name: Check source modules
        shell: bash
        run: |
          run_defs=(Sys.isatty Sys.columns host main)
          foreign() {
            local names=("${run_defs[@]/#/$1}" "${@:2}") list
            printf -v list '%s, ' "${names[@]}"
            printf 'SOME PROOFS FAIL\nError: %d defs rely on unsafe or foreign code:\n' "${#names[@]}"
            printf 'defs that depend on foreign effects: %s\n' "${list%, }"
          }
          failed=0
          while IFS= read -r file; do
            case "$file" in
              ./run.bend) want="$(foreign '')" code=1 ;;
              ./main.bend) want="$(foreign run. main)" code=1 ;;
              ./tests/f32.bend | ./tests/host.bend)
                want="$(foreign ../run. main)" code=1 ;;
              ./examples/*/main.bend) want="$(foreign ../../run. main)" code=1 ;;
              *) want=$'ALL PROOFS CHECK\nUse --verdict for mathematical validity.'
                 code=0 ;;
            esac
            got="$(bend "$file" --check-only 2>&1 </dev/null)" && status=0 || status=$?
            if [ "$got" = "$want" ] && [ "$status" = "$code" ]; then
              echo "ok $file"
            else
              echo "FAIL $file: expected exit $code, got exit $status; output diff:"
              diff <(printf '%s\n' "$want") <(printf '%s\n' "$got") || true
              failed=1
            fi
          done < <(find . -name '*.bend' -not -path './tmp/*' \
            -not -name LAWS.bend -not -name PROOF.bend -print | sort)
          exit "$failed"
      # --verdict builds Bend's proof kernel with Lean once per Bend version
      # and reuses it from ~/.bend/bendtt; the cache saves only on success.
      - name: Restore proof kernel
        id: kernel
        uses: actions/cache@v6
        with:
          path: ~/.bend/bendtt
          key: bendtt-${{ runner.os }}-${{ steps.bend.outputs.version }}
      - name: Install Lean
        if: steps.kernel.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.0
      - name: Check proofs
        run: |
          bend PROOF.bend --verdict
          find examples -name PROOF.bend -print | sort |
            while IFS= read -r file; do
              bend "$file" --verdict
            done
      # SPEC F19: the js end-to-end launcher relies on how this Bun version
      # treats a "--" after the script path.
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install -o /tmp/bun-install.sh
          bash /tmp/bun-install.sh bun-v1.2.23
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          mkdir -p build
          bend main.bend -o build/pkg
          bend main.bend -o build/pkg.js
          bend tests/f32.bend -o build/f32
          bend tests/f32.bend -o build/f32.js
          bend tests/host.bend -o build/host
          bend tests/host.bend -o build/host.js
          for app in hello grep argbench; do
            bend "examples/$app/main.bend" -o "build/$app"
            bend "examples/$app/main.bend" -o "build/$app.js"
          done
          bend bench/main.bend -o build/bench
      - name: End-to-end tests
        run: bend tests/e2e.bend
      # script(1) gives pkg a terminal, so its help must carry SGR bytes
      # (SPEC §13); the BSD and util-linux forms differ.
      - name: TTY smoke test
        run: |
          if [ "$(uname)" = Darwin ]; then
            script -q /tmp/tty.txt build/pkg --help </dev/null >/dev/null
          else
            script -qec "build/pkg --help" /tmp/tty.txt </dev/null >/dev/null
          fi
          LC_ALL=C grep -q $'\033\\[' /tmp/tty.txt
      # `pkg run exit 3` prints a line, then exits 3 by IO.exit, which must
      # flush stdout first: with stdout a closed pipe, the write ends the
      # process by SIGPIPE (141), as any other output to it does (SPEC F3,
      # F15). perl closes the pipe's read end before exec, so no reader can
      # race the write, and runs pkg with SIGPIPE at its default and ignored:
      # the runtime raises it itself, so the runner's setting can't matter.
      - name: Closed stdout
        shell: bash
        run: |
          for app in build/pkg "bun build/pkg.js --"; do
            read -ra cmd <<< "$app"
            for sig in DEFAULT IGNORE; do
              perl -e '$SIG{PIPE} = shift; pipe(my $r, my $w) or die;
                close $r; open STDOUT, ">&", $w or die; close $w;
                exec @ARGV or die' "$sig" "${cmd[@]}" run exit 3 &&
                status=0 || status=$?
              [ "$status" = 141 ] ||
                { echo "$app, SIGPIPE $sig: want 141, got $status"; exit 1; }
            done
          done
      # The examples' laws cover their parsing and each file's output; this
      # covers their IO: a greeting, grep over two files that match and one
      # that cannot be opened, and argbench's line.
      - name: Example apps
        shell: bash
        run: |
          # Bun takes a -- right after the script path (F19).
          app() {
            if [ "$mode" = native ]; then "build/$1" "${@:2}"
            else bun "build/$1.js" -- "${@:2}"; fi
          }
          # want GOT EXPECTED: unless equal, shows both and fails the step.
          want() {
            [ "$1" = "$2" ] ||
              { printf '%s: want %q\n%*s got %q\n' "$mode" "$2" ${#mode} '' "$1"; exit 1; }
          }
          printf 'one x\ntwo x\n' > build/a.txt
          printf 'X three\nfour x\n' > build/b.txt
          for mode in native js; do
            want "$(app hello Ada)" 'Hello, Ada!'
            # -m counts per file, and the missing file makes the exit 2
            # while the others still print.
            out="$(app grep -i -m 1 x build/a.txt build/b.txt build/c.txt \
              2>build/err.txt)" && status=0 || status=$?
            want "$out" $'build/a.txt:one x\nbuild/b.txt:X three'
            want "$(cat build/err.txt)" 'grep: build/c.txt: No such file or directory'
            want "$status" 2
            want "$(app argbench build -vvq -oout.bin --include=src -Ilib a.c)" \
              'build verbose=2 quiet=true output=out.bin include=src,lib jobs=1 format=text inputs=a.c'
          done
      # G6: stdout must not depend on the thread count. The times on stderr
      # are reported, not checked, until the targets are set (SPEC §14.4).
      - name: Benchmark
        shell: bash
        run: |
          for t in 1 all; do
            flags=(); [ "$t" = 1 ] && flags=(+RTS --threads 1 -RTS)
            out=build/bench.$t
            build/bench "${flags[@]}" >"$out.txt" 2>"$out.err" &&
              status=0 || status=$?
            sed "s/^/threads=$t /" "$out.err"
            [ "$status" = 0 ] || exit "$status"
          done
          cat build/bench.1.txt
          for phase in eval help; do
            awk -v p="$phase" '$1 == p":" { ms[FILENAME] = $2 }
              END { a = ms[ARGV[1]]; b = ms[ARGV[2]]
                    if (b > 0) printf "%s speedup: %.1fx\n", p, a / b
                    else printf "%s speedup: n/a, all cores took 0 ms\n", p }' \
              build/bench.1.err build/bench.all.err
          done
          diff build/bench.1.txt build/bench.all.txt

  # SPEC §11: the completion scripts in real shells and the man pages through
  # mandoc. Ubuntu 22.04 has fish 3.3.1, the oldest fish supported, and runs
  # bash 4.4, the oldest bash, in Docker; macOS runs Homebrew's bash 5 and
  # fish 4.
  completions:
    name: Completions and man pages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/bend-install.sh
          sh /tmp/bend-install.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install shells
        run: |
          if [ "$(uname)" = Darwin ]; then
            brew install bash fish
          else
            sudo apt-get update
            sudo apt-get install -y zsh fish mandoc
            docker pull bash:4.4
          fi
          bash --version | head -1
          zsh --version
          fish --version
      - name: Build
        run: |
          mkdir -p build
          bend main.bend -o build/pkg
      - name: Completions and man pages
        run: tests/complete/run.sh bash zsh fish man
      - name: Completions in bash 4.4
        if: runner.os == 'Linux'
        run: |
          BASH_CMD="docker run --rm -it -v $PWD:$PWD bash:4.4 bash" \
            tests/complete/run.sh bash

  # Add G7 in M7, with bench/rc.txt generated from build/bench.c.
